# TaskPlanner Docker Compose - Development Mode
# For production, use: docker-compose -f docker-compose.prod.yml up
version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: taskplanner-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: task_planner
    volumes:
      - mongodb_data:/data/db
    networks:
      - taskplanner-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taskplanner-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - taskplanner-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: taskplanner-backend:dev
    container_name: taskplanner-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://admin:admin123@mongodb:27017
      - MONGODB_DB_NAME=task_planner
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-CHANGE-IN-PRODUCTION
      - DEBUG=True
      - CORS_ORIGINS=["http://localhost:3000"]
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taskplanner-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000/api/v1
    image: taskplanner-frontend:dev
    container_name: taskplanner-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - taskplanner-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  taskplanner-network:
    driver: bridge
